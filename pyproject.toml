[project]
name = "claude-role-skills"
version = "0.1.0"
description = "Claude Code skills by role. This project file only carries the dev tooling and the tests of the skills' scripts."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["fixtures/acme-orders/files", "fixtures/acme-assist/files", "plugins/*/evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["shared", "tools", "fixtures/build_fixture.py", "plugins/software-engineering/skills", "plugins/ai-architect/skills"]
exclude = ['plugins/.*/scripts/(render_page|ai_inventory)\.py$']
