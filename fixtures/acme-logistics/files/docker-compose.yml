services:
  api:
    build: ./src/Acme.Api
    ports:
      - "8080:8080"
    environment:
      ACME_DATABASE_URL: "Host=db;Database=acme;Username=acme;Password=change-me"
      ACME_QUEUE_URL: "amqp://acme:change-me@queue:5672/"
    depends_on:
      - db
      - queue

  web:
    build: ./web
    ports:
      - "4200:4200"
    depends_on:
      - api

  worker:
    build: ./worker
    ports:
      - "8081:8081"
    environment:
      ACME_DATABASE_URL: "postgresql://acme:change-me@db:5432/acme"
      ACME_QUEUE_URL: "amqp://acme:change-me@queue:5672/"
      ACME_CARRIER_URL: "https://carrier.example.com/v1/parcels"
    depends_on:
      - db
      - queue

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: change-me

  queue:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: acme
      RABBITMQ_DEFAULT_PASS: change-me
